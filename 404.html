<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 — The Lantern Philosophy</title>

  <meta name="description" content="The page you are looking for could not be found.">
  <meta name="robots" content="noindex, follow">

  <link rel="icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg: #0C1615;
      --ink: #E3E8DF;
      --flame: #C9A45C;

      --font-display: "Fraunces", serif;
      --font-body: "Source Serif 4", serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      background: #000;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    ::selection {
      background: var(--flame);
      color: var(--bg);
    }

    body::before,
    body::after {
      position: fixed;
      inset: 0;
      content: "";
      pointer-events: none;
    }

    body::before {
      z-index: 5;
      opacity: 0.035;
      mix-blend-mode: overlay;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='noise'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23noise)'/></svg>");
    }

    body::after {
      z-index: 1;
      background:
        radial-gradient(ellipse 900px 500px at 50% 0%,
          rgba(201, 164, 92, 0.09),
          transparent 65%),
        radial-gradient(ellipse 1200px 800px at 50% 100%,
          rgba(0, 0, 0, 0.35),
          transparent 60%);
    }

    .page {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 3rem 1.75rem;
      text-align: center;
    }

    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 420px;
      height: 420px;
      transform: translate(-50%, -55%);
      background:
        radial-gradient(circle,
          rgba(201, 164, 92, 0.12),
          rgba(201, 164, 92, 0.04) 45%,
          transparent 72%);
      filter: blur(8px);
      pointer-events: none;
      animation: breathe 7s ease-in-out infinite;
    }

    @keyframes breathe {

      0%,
      100% {
        opacity: 0.7;
        transform: translate(-50%, -55%) scale(1);
      }

      50% {
        opacity: 1;
        transform: translate(-50%, -55%) scale(1.05);
      }
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(100%, 640px);
    }

    .logo {
      display: block;
      width: min(260px, 70vw);
      height: auto;
      margin: 0 auto 2rem;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: min(100%, 520px);
      margin: 0 auto 2rem;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background:
        linear-gradient(90deg,
          transparent,
          color-mix(in srgb, var(--flame) 40%, transparent),
          transparent);
    }

    .divider-flame {
      width: 13px;
      height: 13px;
      flex: 0 0 13px;
      opacity: 0.85;
    }

    .error-code {
      margin: 0;
      color: var(--flame);
      font-family: var(--font-display);
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 500;
      font-style: italic;
      line-height: 0.9;
      letter-spacing: 0.02em;
    }

    .title {
      margin: 1.5rem 0 0.75rem;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 5vw, 2.5rem);
      font-weight: 500;
      font-style: italic;
      line-height: 1.1;
    }

    .message {
      max-width: 520px;
      margin: 0 auto 2rem;
      color: var(--ink);
      font-size: clamp(1rem, 1.6vw, 1.1rem);
      line-height: 1.8;
      opacity: 0.82;
    }

    .home-link {
      display: inline-block;
      padding: 0.7rem 1.2rem;
      border: 1px solid color-mix(in srgb, var(--flame) 45%, transparent);
      color: var(--flame);
      font-family: var(--font-display);
      font-size: 0.95rem;
      text-decoration: none;
      transition:
        background 0.25s ease,
        border-color 0.25s ease,
        color 0.25s ease;
    }

    .home-link:hover {
      background: var(--flame);
      border-color: var(--flame);
      color: var(--bg);
    }

    .home-link:focus-visible {
      outline: 1px solid var(--flame);
      outline-offset: 4px;
    }

    .footer {
      position: absolute;
      bottom: 2rem;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 0.8rem;
      opacity: 0.45;
    }

    .footer p {
      margin: 0;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .content {
      animation: fade-in 0.7s ease-out both;
    }

    @media (prefers-reduced-motion: reduce) {

      .glow,
      .content {
        animation: none;
      }

      .home-link {
        transition: none;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 2rem 1.25rem;
      }

      .logo {
        width: min(220px, 65vw);
        margin-bottom: 1.5rem;
      }

      .divider {
        gap: 0.75rem;
      }

      .message {
        margin-bottom: 1.75rem;
      }

      .footer {
        bottom: 1.5rem;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="glow" aria-hidden="true"></div>

    <div class="content">

      <img src="logo.webp" alt="The Lantern Philosophy" class="logo" width="260" height="260">

      <div class="divider" aria-hidden="true">
        <span class="divider-line"></span>

        <svg class="divider-flame" viewBox="0 0 24 24">
          <path d="M12 2S5 9.5 5 14.5C5 18.09 8.13 21 12 21S19 18.09 19 14.5C19 9.5 12 2 12 2Z" fill="var(--flame)" />
        </svg>

        <span class="divider-line"></span>
      </div>

      <p class="error-code">404</p>

      <h1 class="title">Page not found</h1>

      <p class="message">
        The page you are looking for may have been lost somewhere in the darkness.
      </p>

      <a href="/" class="home-link">
        Return to the Light
      </a>

    </div>

    <footer class="footer">
      <p>
        &#169; <span id="year"></span> The Lantern Philosophy. All rights reserved.
      </p>
    </footer>

  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>

</html>
